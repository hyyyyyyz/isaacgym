task:
  name: AllegroHandManualDR
  physics_engine: ${..physics_engine}
  env:
    numEnvs: ${resolve_default:4096,${...num_envs}}
    envSpacing: 0.75
    episodeLength: 320
    resetTime: 8
    enableDebugVis: false
    aggregateMode: 1
    clipActions: 1.0
    stiffnessScale: 1.0
    forceLimitScale: 1.0
    useRelativeControl: false
    dofSpeedScale: 20.0
    use_capped_dof_control: false
    max_dof_radians_per_second: 3.1415
    apply_random_quat: true
    actionsMovingAverage:
      range:
      - 0.15
      - 0.35
      schedule_steps: 1000000
      schedule_freq: 500
    controlFrequencyInv: 2
    cubeObsDelayProb: 0.3
    maxObjectSkipObs: 2
    actionDelayProbMax: 0.3
    actionLatencyMax: 15
    actionLatencyScheduledSteps: 10000000
    startPositionNoise: 0.01
    startRotationNoise: 0.0
    resetPositionNoise: 0.03
    resetPositionNoiseZ: 0.01
    resetRotationNoise: 0.0
    resetDofPosRandomInterval: 0.5
    resetDofVelRandomInterval: 0.0
    startObjectPoseDY: -0.19
    startObjectPoseDZ: 0.06
    forceScale: 2.0
    forceProbRange:
    - 0.001
    - 0.1
    forceDecay: 0.99
    forceDecayInterval: 0.08
    random_network_adversary:
      enable: true
      prob: 0.15
      weight_sample_freq: 1000
    random_cube_observation:
      enable: true
      prob: 0.3
    distRewardScale: -10.0
    rotRewardScale: 1.0
    rotEps: 0.1
    actionPenaltyScale: -0.0001
    actionDeltaPenaltyScale: -0.01
    reachGoalBonus: 250
    fallDistance: 0.24
    fallPenalty: 0.0
    objectType: block
    observationType: no_vel
    asymmetric_observations: true
    successTolerance: 0.4
    printNumSuccesses: false
    maxConsecutiveSuccesses: 50
    asset:
      assetFileName: urdf/kuka_allegro_description/allegro_touch_sensor.urdf
      assetFileNameBlock: urdf/objects/cube_multicolor_allegro.urdf
      assetFileNameEgg: mjcf/open_ai_assets/hand/egg.xml
      assetFileNamePen: mjcf/open_ai_assets/hand/pen.xml
    enableCameraSensors: false
  task:
    randomize: true
    randomization_params:
      frequency: 720
      observations:
        dof_pos:
          range:
          - 0
          - 0.005
          range_correlated:
          - 0
          - 0.01
          operation: additive
          distribution: gaussian
        object_pose_cam:
          range:
          - 0
          - 0.005
          range_correlated:
          - 0
          - 0.01
          operation: additive
          distribution: gaussian
        goal_pose:
          range:
          - 0
          - 0.005
          range_correlated:
          - 0
          - 0.01
          operation: additive
          distribution: gaussian
        goal_relative_rot_cam:
          range:
          - 0
          - 0.005
          range_correlated:
          - 0
          - 0.01
          operation: additive
          distribution: gaussian
        last_actions:
          range:
          - 0
          - 0.005
          range_correlated:
          - 0
          - 0.01
          operation: additive
          distribution: gaussian
      actions:
        range:
        - 0.0
        - 0.05
        range_correlated:
        - 0
        - 0.02
        operation: additive
        distribution: gaussian
      sim_params:
        gravity:
          range:
          - 0
          - 0.5
          operation: additive
          distribution: gaussian
      actor_params:
        hand:
          color: true
          dof_properties:
            damping:
              range:
              - 0.3
              - 3.0
              operation: scaling
              distribution: loguniform
            stiffness:
              range:
              - 0.75
              - 1.5
              operation: scaling
              distribution: loguniform
            lower:
              range:
              - 0
              - 0.01
              operation: additive
              distribution: gaussian
            upper:
              range:
              - 0
              - 0.01
              operation: additive
              distribution: gaussian
          rigid_body_properties:
            mass:
              range:
              - 0.5
              - 2.0
              operation: scaling
              distribution: uniform
              setup_only: true
          rigid_shape_properties:
            friction:
              num_buckets: 250
              range:
              - 0.2
              - 1.2
              operation: scaling
              distribution: uniform
            restitution:
              num_buckets: 100
              range:
              - 0.0
              - 0.4
              operation: additive
              distribution: uniform
        object:
          scale:
            range:
            - 0.95
            - 1.05
            operation: scaling
            distribution: uniform
            setup_only: true
          rigid_body_properties:
            mass:
              range:
              - 0.5
              - 1.5
              operation: scaling
              distribution: uniform
              setup_only: true
          rigid_shape_properties:
            friction:
              num_buckets: 250
              range:
              - 0.2
              - 1.2
              operation: scaling
              distribution: uniform
            restitution:
              num_buckets: 100
              range:
              - 0.0
              - 0.4
              operation: additive
              distribution: uniform
  sim:
    dt: 0.01667
    substeps: 2
    up_axis: z
    use_gpu_pipeline: ${eq:${...pipeline},"gpu"}
    gravity:
    - 0.0
    - 0.0
    - -9.81
    physx:
      num_threads: ${....num_threads}
      solver_type: ${....solver_type}
      use_gpu: ${contains:"cuda",${....sim_device}}
      num_position_iterations: 8
      num_velocity_iterations: 0
      max_gpu_contact_pairs: 8388608
      num_subscenes: ${....num_subscenes}
      contact_offset: 0.005
      rest_offset: 0.0
      bounce_threshold_velocity: 0.2
      max_depenetration_velocity: 1.0
      default_buffer_size_multiplier: 75.0
      contact_collection: 0
train:
  params:
    seed: ${...seed}
    algo:
      name: a2c_continuous
    model:
      name: continuous_a2c_logstd
    network:
      name: actor_critic
      separate: false
      space:
        continuous:
          mu_activation: None
          sigma_activation: None
          mu_init:
            name: default
          sigma_init:
            name: const_initializer
            val: 0
          fixed_sigma: true
      inputs:
        dof_pos_randomized: {}
        object_pose_cam_randomized: {}
        goal_pose_randomized: {}
        goal_relative_rot_cam_randomized: {}
        last_actions_randomized: {}
      mlp:
        units:
        - 256
        activation: elu
        d2rl: false
        initializer:
          name: default
        regularizer:
          name: None
      rnn:
        name: lstm
        units: 512
        layers: 1
        before_mlp: true
        layer_norm: true
    load_checkpoint: ${if:${...checkpoint},True,False}
    load_path: ${...checkpoint}
    config:
      name: ${resolve_default:AllegroHandManualDRAsymmLSTM,${....experiment}}
      full_experiment_name: ${.name}
      env_name: rlgpu
      multi_gpu: ${....multi_gpu}
      ppo: true
      mixed_precision: false
      normalize_input: true
      normalize_value: true
      value_bootstrap: false
      num_actors: ${....task.env.numEnvs}
      reward_shaper:
        scale_value: 1.0
      normalize_advantage: true
      gamma: 0.998
      tau: 0.95
      learning_rate: 0.0001
      lr_schedule: adaptive
      schedule_type: standard
      kl_threshold: 0.016
      score_to_win: 100000
      max_epochs: ${resolve_default:50000,${....max_iterations}}
      save_best_after: 200
      save_frequency: 500
      print_stats: true
      grad_norm: 1.0
      entropy_coef: 0.0
      truncate_grads: true
      e_clip: 0.2
      horizon_length: 16
      minibatch_size: 16384
      mini_epochs: 4
      critic_coef: 4
      clip_value: true
      seq_length: 16
      bounds_loss_coef: 0.0001
      zero_rnn_on_done: false
      central_value_config:
        minibatch_size: 16384
        mini_epochs: 4
        learning_rate: 0.0001
        kl_threshold: 0.016
        clip_value: true
        normalize_input: true
        truncate_grads: true
        network:
          name: actor_critic
          central_value: true
          inputs:
            dof_pos: {}
            dof_vel: {}
            dof_force: {}
            object_pose: {}
            object_pose_cam_randomized: {}
            object_vels: {}
            goal_pose: {}
            goal_relative_rot: {}
            last_actions: {}
            ft_force_torques: {}
            gravity_vec: {}
            ft_states: {}
          mlp:
            units:
            - 512
            - 256
            - 128
            activation: elu
            d2rl: false
            initializer:
              name: default
            regularizer:
              name: None
      player:
        deterministic: true
        use_vecenv: true
        games_num: 1000000
        print_stats: false
pbt:
  enabled: false
task_name: ${task.name}
experiment: ''
num_envs: ''
seed: 42
torch_deterministic: false
max_iterations: ''
physics_engine: physx
pipeline: gpu
sim_device: cuda:0
rl_device: cuda:0
graphics_device_id: 0
num_threads: 4
solver_type: 1
num_subscenes: 4
test: false
checkpoint: ''
sigma: ''
multi_gpu: false
wandb_activate: false
wandb_group: ''
wandb_name: ${train.params.config.name}
wandb_entity: ''
wandb_project: isaacgymenvs
wandb_tags: []
wandb_logcode_dir: ''
capture_video: false
capture_video_freq: 1464
capture_video_len: 100
force_render: true
headless: false
